<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#234dd0"><title>게임 입장 | 퀴즈 실험실 v2</title>
  <link rel="stylesheet" href="styles.css"><script type="module" src="js/join.js"></script>
</head>
<body>
<div class="shell"><header class="site-header"><a class="brand" href="./"><span class="brand-icon">Q</span> 퀴즈 실험실</a><span class="version">학생 게임 입장 · v2</span></header>
<main class="page-content student-page">
  <div class="page-heading"><span class="eyebrow">JOIN QUIZ / V2</span><h1>퀴즈 방에 입장하기</h1><p>선생님이 알려주신 참여 코드를 입력해 주세요. 지금은 가상 이름으로 연결을 시험합니다.</p></div>
  <section class="panel student-panel">
    <div class="connection"><span id="join-dot" class="connection-dot"></span><span id="join-connection">서버 연결 확인 중…</span></div>
    <label class="field-label" for="join-code">6자리 참여 코드</label><input id="join-code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="off" placeholder="예: 482731" aria-label="6자리 참여 코드">
    <label class="field-label" for="join-name" style="margin-top:16px">가상 이름</label><input id="join-name" maxlength="20" autocomplete="off" placeholder="예: 테스트학생01" aria-label="가상 이름">
    <p class="helper">실제 학생 이름은 아직 입력하지 마세요.</p>
    <div class="button-row button-stack"><button id="join-room-btn" class="btn btn-primary btn-big">게임 방 입장</button><button id="leave-room-btn" class="btn btn-outline btn-big" hidden>대기실 나가기</button></div>
    <p id="join-feedback" class="feedback" role="status" aria-live="polite"></p>
  </section>
  <section id="student-room" class="panel" hidden>
    <div class="panel-header"><h2 id="student-room-title">대기실</h2><span id="student-room-state" class="pill pill-neutral">대기 중</span></div>
    <p id="student-room-meta" class="helper"></p>
    <div class="room-waiting"><span aria-hidden="true">🎮</span><strong>선생님의 안내를 기다려 주세요</strong><span>v3부터 실제 퀴즈 문제를 풀 수 있습니다.</span></div>
    <div class="panel-header"><h2>접속한 친구들</h2><span class="count" id="join-count">0명</span></div>
    <div id="join-members" class="student-grid"></div>
  </section>
  <p class="notice centered">현재는 실시간 게임 방 입장 테스트입니다. 점수와 문제 출제는 없습니다.</p>
  <a class="back-link" href="./">← 처음 화면으로</a>
</main><footer>CLASSROOM QUIZ LAB · v2</footer></div>
</body>
</html>
