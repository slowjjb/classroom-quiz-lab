<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#234dd0"><title>학생 화면 | 퍼플킷 v3.12</title>
  <link rel="stylesheet" href="styles.css?v=3.12">
  <script type="module" src="js/student.js?v=3.11"></script>
</head>
<body>
  <div class="shell">
    <header class="site-header"><a class="brand" href="./"><span class="brand-emblem" aria-hidden="true"><span class="brand-icon">P</span><span class="brand-spark brand-spark-a"></span><span class="brand-spark brand-spark-b"></span></span><span class="brand-lockup"><span class="brand-kicker">PURPLEKIT</span><span class="brand-name">퍼플킷</span></span></a><span class="version">학생 연결 화면 · v3.12</span></header>
    <main class="page-content student-page">
      <div class="page-heading"><span class="eyebrow">PURPLEKIT · STUDENT</span><h1>반가워요, 퀴즈 탐험가!</h1><p>아래 연결 테스트는 예전 기능입니다. 실제 게임에 참여하려면 <a href="join.html"><strong>퍼플킷 학생 입장하기</strong></a>를 이용해 주세요.</p></div>
      <section class="panel student-panel">
        <div class="student-symbol" aria-hidden="true">✦</div>
        <div class="connection"><span id="connection-dot" class="connection-dot"></span><span id="connection-label">아직 접속하지 않았어요</span></div>
        <label for="nickname" class="field-label">테스트 이름</label>
        <input id="nickname" type="text" maxlength="20" autocomplete="off" placeholder="예: 테스트학생01" aria-describedby="name-hint">
        <p id="name-hint" class="helper">실제 학생 이름 대신 가상 이름을 사용해 주세요.</p>
        <div class="button-row button-stack"><button type="button" id="join-btn" class="btn btn-primary btn-big" disabled>연결 테스트 시작</button><button type="button" id="leave-btn" class="btn btn-outline btn-big" hidden>연결 종료</button></div>
        <p id="student-message" class="feedback" role="status" aria-live="polite">Firebase 설정을 확인하고 있어요.</p>
      </section>
      <p class="notice centered">연결 테스트 중에는 문제를 풀거나 점수를 얻지 않습니다.</p>
      <a class="btn btn-primary" href="join.html" style="display:inline-flex;margin:18px 0">퍼플킷 게임에 입장하기 →</a>
      <a class="back-link" href="./">← 처음 화면으로</a>
    </main><footer>PURPLEKIT · 학생 연결 화면</footer>
  </div>
</body>
</html>
