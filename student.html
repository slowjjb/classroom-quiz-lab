<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#234dd0"><title>학생 화면 | 퀴즈 실험실 v1</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/student.js"></script>
</head>
<body>
  <div class="shell">
    <header class="site-header"><a class="brand" href="./"><span class="brand-icon">Q</span> 퀴즈 실험실</a><span class="version">학생 · v1</span></header>
    <main class="page-content student-page">
      <div class="page-heading"><span class="eyebrow">STUDENT LOBBY</span><h1>반가워요, 퀴즈 탐험가!</h1><p>교사 화면에서 문제를 준비하는 중이에요. 학생은 아직 연결 테스트만 할 수 있어요.</p></div>
      <section class="panel student-panel">
        <div class="student-symbol" aria-hidden="true">✦</div>
        <div class="connection"><span id="connection-dot" class="connection-dot"></span><span id="connection-label">아직 접속하지 않았어요</span></div>
        <label for="nickname" class="field-label">테스트 이름</label>
        <input id="nickname" type="text" maxlength="20" autocomplete="off" placeholder="예: 테스트학생01" aria-describedby="name-hint">
        <p id="name-hint" class="helper">실제 학생 이름 대신 가상 이름을 사용해 주세요.</p>
        <div class="button-row button-stack"><button type="button" id="join-btn" class="btn btn-primary btn-big" disabled>연결 테스트 시작</button><button type="button" id="leave-btn" class="btn btn-outline btn-big" hidden>연결 종료</button></div>
        <p id="student-message" class="feedback" role="status" aria-live="polite">Firebase 설정을 확인하고 있어요.</p>
      </section>
      <p class="notice centered">연결 테스트 중에는 문제를 풀거나 점수를 얻지 않습니다.</p>
      <a class="back-link" href="./">← 처음 화면으로</a>
    </main><footer>CLASSROOM QUIZ LAB · v1</footer>
  </div>
</body>
</html>
